name: Update GitHub statistics

on:
  schedule:
    - cron: "0 22 * * *"
  push:
    paths:
      - ".github/workflows/update-github-stats.yml"
      - "scripts/update-github-stats.mjs"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub statistics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/update-github-stats.mjs

      - name: Publish updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub statistics"
          git push
