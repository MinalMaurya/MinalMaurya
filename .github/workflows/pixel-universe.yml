name: Update Pixel Universe

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout output branch
        uses: actions/checkout@v5
        with:
          ref: output

      - name: Checkout source files
        uses: actions/checkout@v5
        with:
          ref: main
          path: source

      - name: Generate contribution universe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: MinalMaurya
        run: |
          python source/scripts/generate_pixel_universe.py

      - name: Copy generated SVG
        run: |
          cp source/assets/pixel-universe.svg assets/pixel-universe.svg

      - name: Publish SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/pixel-universe.svg

          git diff --cached --quiet || git commit -m "chore: update pixel universe"

          git push origin output