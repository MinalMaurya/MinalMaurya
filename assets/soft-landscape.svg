<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1200 330"
width="1200"
height="330"
role="img"
aria-label="Soft pastel landscape with sky, trees, grass and flowers">

<defs>

  <!-- Soft sky -->

  <linearGradient
    id="sky"
    x1="0"
    y1="0"
    x2="0"
    y2="1">

    <stop
      offset="0%"
      stop-color="#dfe9ff"/>

    <stop
      offset="55%"
      stop-color="#f4e9f7"/>

    <stop
      offset="100%"
      stop-color="#fff3e8"/>

  </linearGradient>


  <!-- Distant hill -->

  <linearGradient
    id="hill"
    x1="0"
    y1="0"
    x2="0"
    y2="1">

    <stop
      offset="0%"
      stop-color="#c8d9c4"/>

    <stop
      offset="100%"
      stop-color="#a9c2a3"/>

  </linearGradient>


  <!-- Foreground grass -->

  <linearGradient
    id="grass"
    x1="0"
    y1="0"
    x2="0"
    y2="1">

    <stop
      offset="0%"
      stop-color="#9fbd91"/>

    <stop
      offset="100%"
      stop-color="#789a70"/>

  </linearGradient>


  <!-- Sun -->

  <radialGradient
    id="sun">

    <stop
      offset="0%"
      stop-color="#fff5cf"
      stop-opacity=".95"/>

    <stop
      offset="100%"
      stop-color="#fff5cf"
      stop-opacity="0"/>

  </radialGradient>


  <filter id="soft">

    <feGaussianBlur
      stdDeviation="8"/>

  </filter>


  <style>

    .float {

      animation:
        float
        5s
        ease-in-out
        infinite;

    }

    .sway {

      transform-box:
        fill-box;

      transform-origin:
        bottom center;

      animation:
        sway
        4s
        ease-in-out
        infinite;

    }

    @keyframes float {

      0%,100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-5px);
      }

    }

    @keyframes sway {

      0%,100% {
        transform:
          rotate(-2deg);
      }

      50% {
        transform:
          rotate(2deg);
      }

    }

  </style>

</defs>


<!-- ========================= -->
<!-- SKY -->
<!-- ========================= -->

<rect
  width="1200"
  height="330"
  fill="url(#sky)"/>


<!-- Soft sun -->

<circle
  cx="920"
  cy="75"
  r="100"
  fill="url(#sun)"
  filter="url(#soft)"/>

<circle
  cx="920"
  cy="75"
  r="35"
  fill="#fff1c7"
  opacity=".75"/>


<!-- ========================= -->
<!-- CLOUDS -->
<!-- ========================= -->

<g
