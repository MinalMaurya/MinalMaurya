  fill="#ffffff"
  opacity=".72">

  <circle
    cx="170"
    cy="75"
    r="25"/>

  <circle
    cx="200"
    cy="68"
    r="34"/>

  <circle
    cx="235"
    cy="78"
    r="24"/>

  <rect
    x="165"
    y="75"
    width="75"
    height="25"
    rx="13"/>

</g>


<g
  class="float"
  style="animation-delay:1.4s"
  fill="#ffffff"
  opacity=".58">

  <circle
    cx="700"
    cy="52"
    r="20"/>

  <circle
    cx="730"
    cy="46"
    r="28"/>

  <circle
    cx="760"
    cy="57"
    r="21"/>

  <rect
